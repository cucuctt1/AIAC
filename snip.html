<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Select screenshot region</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; cursor: crosshair; background: #090c14; font-family: "Segoe UI", sans-serif; }
    #screen { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; pointer-events: none; }
    #shade { position: absolute; inset: 0; background: rgba(0,0,0,.34); pointer-events: none; }
    #selection { position: absolute; display: none; border: 2px solid #7dccff; background: rgba(100,190,255,.08); box-shadow: 0 0 0 9999px rgba(0,0,0,.38), 0 0 18px rgba(80,185,255,.75); pointer-events: none; }
    #hint { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); padding: 9px 14px; border: 1px solid rgba(255,255,255,.2); border-radius: 12px; color: white; background: rgba(10,14,24,.85); font-size: 13px; pointer-events: none; }
    #screens { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; align-items: center; gap: 9px; padding: 8px; border: 1px solid rgba(255,255,255,.2); border-radius: 13px; background: rgba(10,14,24,.9); cursor: default; }
    #screens button { height: 30px; padding: 0 12px; border: 1px solid rgba(255,255,255,.18); border-radius: 9px; color: white; background: rgba(255,255,255,.1); cursor: pointer; }
    #screenLabel { min-width: 120px; color: white; text-align: center; font-size: 12px; }
  </style>
</head>
<body>
  <img id="screen" alt="Primary monitor capture">
  <div id="shade"></div>
  <div id="selection"></div>
  <div id="hint">Drag to select · Enter to share · Esc to cancel</div>
  <div id="screens"><button id="previous" type="button">Previous</button><span id="screenLabel"></span><button id="next" type="button">Next</button></div>
  <script>
    const image = document.getElementById('screen');
    const selection = document.getElementById('selection');
    const hint = document.getElementById('hint');
    const previous = document.getElementById('previous');
    const next = document.getElementById('next');
    const screenLabel = document.getElementById('screenLabel');
    let start = null;
    let rect = null;
    let screens = [];
    let screenIndex = 0;

    const showScreen = index => {
      if (!screens.length) return;
      screenIndex = (index + screens.length) % screens.length;
      image.src = screens[screenIndex].imageUrl;
      screenLabel.textContent = `${screens[screenIndex].label} (${screenIndex + 1}/${screens.length})`;
      selection.style.display = 'none';
      rect = null;
      window.snip.screenChanged(screenIndex);
    };
    window.snip.onStart(payload => { screens = payload.screens || []; showScreen(payload.initialIndex || 0); });
    const draw = (a, b) => {
      const left = Math.min(a.x, b.x), top = Math.min(a.y, b.y);
      const width = Math.abs(a.x - b.x), height = Math.abs(a.y - b.y);
      rect = { x: left / innerWidth, y: top / innerHeight, width: width / innerWidth, height: height / innerHeight };
      Object.assign(selection.style, { display: 'block', left: left + 'px', top: top + 'px', width: width + 'px', height: height + 'px' });
    };
    addEventListener('mousedown', event => { start = { x: event.clientX, y: event.clientY }; rect = null; draw(start, start); });
    addEventListener('mousemove', event => { if (start) draw(start, { x: event.clientX, y: event.clientY }); });
    addEventListener('mouseup', event => { if (!start) return; draw(start, { x: event.clientX, y: event.clientY }); start = null; hint.textContent = 'Press Enter to share this region · Drag again to replace · Esc to cancel'; });
    addEventListener('keydown', event => {
      if (event.key === 'Escape') window.snip.cancel();
      if (event.key === 'ArrowLeft') showScreen(screenIndex - 1);
      if (event.key === 'ArrowRight' || event.key === 'Tab') { event.preventDefault(); showScreen(screenIndex + 1); }
      if (event.key === 'Enter' && rect && rect.width >= .01 && rect.height >= .01) window.snip.complete({ ...rect, screenIndex });
    });
    for (const [button, direction] of [[previous, -1], [next, 1]]) {
      button.addEventListener('mousedown', event => event.stopPropagation());
      button.addEventListener('click', event => { event.stopPropagation(); showScreen(screenIndex + direction); });
    }
    addEventListener('contextmenu', event => { event.preventDefault(); window.snip.cancel(); });
  </script>
</body>
</html>
